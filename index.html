<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha Agenda</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#F6F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json" id="manifestLink">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=fono2" id="appleIcon">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=fono2" id="favIcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, faixa da semana no topo, linha do tempo do dia, barra de abas fixa embaixo */
:root{
  --bg:#F6F5FA; --surface:#FFFFFF; --ink:#1E1B2E; --muted:#6B6880; --line:#E4E1EE;
  --accent:#C2256A; --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--surface));
  --ok:#1F8A4C; --ok-soft:#E3F4EA; --warn:#B46A0B; --warn-soft:#FBF0DF; --bad:#C23B3B; --bad-soft:#FBE6E6;
  --p1:#138A80; --p2:#D2554A; --p3:#B7791F; --p4:#2F6FD6; --p5:#C2408F; --p6:#3E8E3A;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(30,27,46,.06), 0 8px 24px rgba(30,27,46,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121019; --surface:#1C1926; --ink:#ECEAF4; --muted:#9A96AD; --line:#2D2939;
  --accent:#FF7AB6; --accent-ink:#14111D;
  --ok:#5CCB8A; --ok-soft:#173326; --warn:#E9A94E; --warn-soft:#3A2B14; --bad:#F07E7E; --bad-soft:#3D1D1F;
  --p1:#4FC9BC; --p2:#F08A7F; --p3:#E8B04E; --p4:#78A6F5; --p5:#EB86C4; --p6:#82C97D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
/* Cor de destaque personalizável (Ajustes › Aparência): só troca --accent/--accent-ink
   (--accent-soft se recalcula sozinho pela fórmula acima), nunca --bg/--ink, então
   continua seguindo o tema claro/escuro do aparelho. */
:root[data-accent="azul"]{--accent:#2F6FD6;--accent-ink:#FFFFFF}
:root[data-accent="verde"]{--accent:#1F8A4C;--accent-ink:#FFFFFF}
:root[data-accent="roxo"]{--accent:#7C3AED;--accent-ink:#FFFFFF}
:root[data-accent="laranja"]{--accent:#C2730B;--accent-ink:#FFFFFF}
:root[data-accent="teal"]{--accent:#138A80;--accent-ink:#FFFFFF}
@media (prefers-color-scheme: dark){
  :root[data-accent="azul"]{--accent:#78A6F5;--accent-ink:#14111D}
  :root[data-accent="verde"]{--accent:#5CCB8A;--accent-ink:#14111D}
  :root[data-accent="roxo"]{--accent:#B389F5;--accent-ink:#14111D}
  :root[data-accent="laranja"]{--accent:#F0B45E;--accent-ink:#14111D}
  :root[data-accent="teal"]{--accent:#4FC9BC;--accent-ink:#14111D}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top h1{font-size:28px}
.top .sub{font-size:14px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.day{border:0;background:transparent;border-radius:14px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.day .dw{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day .dn{font-family:var(--display);font-size:20px;font-weight:700}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;display:block}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel .dw,.day.sel .dn{color:var(--accent-ink)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.weeknav .m{font-weight:600;text-transform:capitalize}
.weeknav .btns{display:flex;gap:6px}

/* Day header */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.dayhead h2{font-size:22px}

/* Timeline */
.list{display:flex;flex-direction:column;gap:8px}
.appt{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px 14px 12px 0;box-shadow:var(--shadow);border:0;text-align:left;width:100%;position:relative;overflow:hidden}
.appt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.appt .t{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:15px;line-height:1.2}
.appt .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.appt .who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appt .where{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.appt .where i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.appt.dim{opacity:.55}
.appt.dim .who{text-decoration:line-through}
.free{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:9px 14px 9px 0;background:transparent;text-align:left;width:100%;color:var(--muted)}
.free .t{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.free .plus{font-weight:600;color:var(--accent);font-size:14px}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st-agendado{background:var(--accent-soft);color:var(--accent)}
.st-confirmado{background:var(--ok-soft);color:var(--ok)}
.st-concluido{background:var(--line);color:var(--ink)}
.st-faltou{background:var(--warn-soft);color:var(--warn)}
.st-cancelado{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* Cards / lists */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.rows{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--muted)}
.swatch{width:12px;height:12px;border-radius:50%;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.datebox{min-height:40px;max-width:210px;padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap}

/* Summary */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pc)}

/* Demo bar */
.demobar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.demobar span{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demobar button{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;flex:none;background:var(--accent-ink);color:var(--accent)}
body.has-demobar .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 58px)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:transparent;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:22px;height:22px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet .sh h3{font-size:20px}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.pwfield{position:relative;display:flex}
.pwfield input{flex:1;padding-right:46px}
.pwfield .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.pwfield .eye svg{width:20px;height:20px}
.pwfield .eye:active{background:var(--line)}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-height:48px;appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.input{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600}
.seg button.on{border-color:transparent}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.colors button.on{border-color:var(--ink)}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.iconpick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:2px solid transparent;background:transparent;text-align:center}
.iconpick button img{width:52px;height:52px;border-radius:14px;box-shadow:var(--shadow)}
.iconpick button span{font-size:12px;font-weight:600;line-height:1.2}
.iconpick button.on{border-color:var(--accent);background:var(--accent-soft)}
.hours{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.hrow .dn{padding-top:12px;font-weight:600}
.hrow .ivs{display:flex;flex-direction:column;gap:6px}
.iv{display:grid;grid-template-columns:1fr auto 1fr 40px;gap:6px;align-items:center}
.iv .input{min-height:42px;padding:8px 10px;font-size:15px}
.iv .x{width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;text-align:left;font-size:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.info{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px}
pre.share{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;font:15px/1.5 var(--body)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

/* Visualização de impressão (dentro do app: window.open não funciona no PWA instalado) */
#printArea{position:fixed;inset:0;z-index:70;background:#fff;color:#1e1b2e;overflow-y:auto;-webkit-overflow-scrolling:touch}
#printArea .pdBar{position:sticky;top:0;background:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;border-bottom:1px solid #e4e1ee}
#printArea .pdBar button{font:15px/1 var(--body);font-weight:600;padding:11px 16px;border-radius:10px;border:0;cursor:pointer}
#printArea .pdPrint{background:#5b3fd6;color:#fff}
#printArea .pdClose{background:#e4e1ee;color:#1e1b2e}
#printArea .pdInner{font:14px/1.5 -apple-system,"Segoe UI",Arial,sans-serif;max-width:760px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px))}
#printArea h1{font-size:20px;margin:0 0 14px}
#printArea h2{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:#5b3fd6}
#printArea .kv{border-collapse:collapse;width:100%}
#printArea .kv th{text-align:left;width:38%;color:#6b6880;font-weight:600;padding:5px 8px 5px 0;vertical-align:top}
#printArea .kv td{padding:5px 0}
#printArea .grid{border-collapse:collapse;width:100%;font-size:13px}
#printArea .grid th,#printArea .grid td{border:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}
#printArea .grid th{background:#f3f1fa}
#printArea .ev{border-top:1px solid #e4e1ee;padding:10px 0}
#printArea .ev p{white-space:pre-wrap;margin:4px 0}
#printArea .meta{color:#6b6880}
#printArea .sign{margin-top:48px;text-align:center}
#printArea .sign .line{width:260px;border-top:1px solid #1e1b2e;margin:0 auto 6px}
@media print{
  @page{margin:14mm 12mm}
  body>*:not(#printArea){display:none!important}
  #printArea{position:static;overflow:visible}
  #printArea .pdBar{display:none}
  /* Evita quebrar uma evolução, a tabela ou a assinatura no meio entre duas
     páginas, e repete o cabeçalho da tabela de pacientes em listas longas. */
  #printArea .ev,#printArea .sign,#printArea .kv tr,#printArea .grid tr{page-break-inside:avoid;break-inside:avoid}
  #printArea h1,#printArea h2{page-break-after:avoid;break-after:avoid}
  #printArea .grid thead{display:table-header-group}
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Onboarding */
.ob{display:flex;flex-direction:column;gap:18px;padding-top:24px}
.ob .hero{display:flex;flex-direction:column;gap:10px}
.ob .hero h1{font-size:34px;line-height:1.1}
.ob .mark{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.ob .mark svg{width:34px;height:34px}
.obplace{display:grid;grid-template-columns:auto 1fr 40px;gap:10px;align-items:center}
.obplace .swatch{width:16px;height:16px}
.obsteps{display:flex;gap:6px}
.obsteps i{flex:1;height:4px;border-radius:99px;background:var(--line);font-style:normal}
.obsteps i.on{background:var(--accent)}

.tabs .in{grid-template-columns:repeat(5,1fr)}
.tab{font-size:10.5px}
.seg button.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.seg.solid button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.ptotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ptotal b{font-family:var(--display);font-size:17px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.stats.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:380px){.stats.three{grid-template-columns:repeat(2,1fr)}}
.stat .v.sm{font-size:19px}
.cpick{display:flex;flex-direction:column;gap:12px}
.cpad{position:relative;height:170px;border-radius:14px;touch-action:none;cursor:crosshair;
  background:linear-gradient(to bottom,rgba(255,255,255,.82),rgba(255,255,255,0) 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.72)),linear-gradient(to right,hsl(0,78%,53%),hsl(30,78%,53%),hsl(60,78%,53%),hsl(90,78%,53%),hsl(120,78%,53%),hsl(150,78%,53%),hsl(180,78%,53%),hsl(210,78%,53%),hsl(240,78%,53%),hsl(270,78%,53%),hsl(300,78%,53%),hsl(330,78%,53%),hsl(360,78%,53%));
  box-shadow:inset 0 0 0 1px var(--line)}

.obcol.on{box-shadow:0 0 0 2px var(--ink)}
.obpick{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.cdone{margin-top:2px}
#pTabs{position:sticky;top:-4px;z-index:2;background:var(--bg);padding-block:6px}
#pTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#pTabs button{padding:9px 4px;font-size:13px;text-align:center}
.sheet.tall{height:92%}
.ob .mark{width:76px;height:76px;background:none;border-radius:22%;overflow:hidden;box-shadow:0 10px 26px rgba(214,51,122,.35)}
.ob .mark .logo{width:100%;height:100%;display:block}

<body>

<script>
(()=>{
const KEY='minha-agenda-v1';
const COLORS=['p1','p2','p3','p4','p5','p6'];
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const STATUS={agendado:'Agendado',confirmado:'Confirmado',concluido:'Atendido',faltou:'Faltou',cancelado:'Cancelado'};
const DEFAULT_MSG='Olá, {paciente}! Passando para confirmar seu atendimento {dia} às {hora} em {local}. Posso confirmar?';

const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EYE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.17 4.1M6.2 6.2A15.7 15.7 0 0 0 2 12s3.6 7 10 7c1.1 0 2.13-.18 3.06-.5"/></svg>';
// Campo de senha com "olhinho" pra mostrar/esconder o que foi digitado.
const pwField=(id,label,opts)=>{opts=opts||{};return `<label class="field"><span>${esc(label)}</span><div class="pwfield"><input class="input" id="${id}" type="password" ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''} autocomplete="${opts.autocomplete||'current-password'}"><button type="button" class="eye" data-pw="${id}" aria-label="Mostrar senha">${EYE_SVG}</button></div></label>`};
const wireEye=id=>{const btn=document.querySelector(`[data-pw="${id}"]`),inp=$('#'+id);if(!btn||!inp)return;
  btn.onclick=()=>{const show=inp.type==='password';inp.type=show?'text':'password';btn.innerHTML=show?EYE_OFF_SVG:EYE_SVG;btn.setAttribute('aria-label',show?'Esconder senha':'Mostrar senha')}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)}));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const startOfWeek=d=>addDays(d,-((d.getDay()+6)%7));
const todayISO=()=>iso(new Date());
const digits=s=>String(s||'').replace(/\D/g,'');
const fmtPhone=s=>{const d=digits(s);if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return s||''};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const fmtDate=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const dayLabel=s=>{const d=parse(s);if(s===todayISO())return 'hoje';if(s===iso(addDays(new Date(),1)))return 'amanhã';return `${WDL[d.getDay()]}, ${d.getDate()}/${pad(d.getMonth()+1)}`};
const TIMES=(()=>{const o=[];for(let m=5*60;m<=23*60+45;m+=15)o.push(toHM(m));return o})();
const timeSel=(attrs,val)=>{const list=TIMES.includes(val)||!val?TIMES:[...TIMES,val].sort();return `<select class="input num" ${attrs}>${list.map(t=>`<option value="${t}" ${t===val?'selected':''}>${t}</option>`).join('')}</select>`};
const DAY_ORDER=[1,2,3,4,5,6,0];
const cv=c=>!c?'var(--p1)':(c[0]==='#'?c:`var(--${c})`);
const tokenHex=c=>{if(!c)return '#138a80';if(c[0]==='#')return c;const v=getComputedStyle(document.documentElement).getPropertyValue('--'+c).trim();return v||'#138a80'};
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hexToHsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,l=(mx+mn)/2,d=mx-mn,s=d?d/(1-Math.abs(2*l-1)):0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:s*100,l:l*100}}
/* seletor de cor: arraste o dedo no quadro (matiz na horizontal, claro/escuro na vertical) */
function colorPicker(root,initial,onChange,onDone){
  const SAT=78,LMAX=88,LMIN=18;
  root.innerHTML=`<div class="cpad" tabindex="0" aria-label="Escolher cor"><div class="cthumb"></div></div>
    <div class="crow"><span class="cprev"></span><input class="input num chex" maxlength="7" spellcheck="false" autocapitalize="off" aria-label="Código da cor"><span class="small muted">ou escolha rápida:</span></div>
    <div class="colors">${COLORS.map(c=>`<button type="button" data-c="${c}" style="--c:${cv(c)}" aria-label="Cor sugerida"></button>`).join('')}</div>${onDone?'<button type="button" class="btn primary block cdone">Confirmar cor</button>':''}`;
  const pad=root.querySelector('.cpad'),th=root.querySelector('.cthumb'),pv=root.querySelector('.cprev'),hx=root.querySelector('.chex');
  let cur=initial;
  const place=(hex)=>{const{h,l}=hexToHsl(hex);th.style.left=(h/360*100)+'%';th.style.top=(Math.max(0,Math.min(1,(LMAX-l)/(LMAX-LMIN)))*100)+'%'};
  const show=(c,fromInput)=>{cur=c;const hex=tokenHex(c);pv.style.background=cv(c);th.style.background=hex;if(!fromInput)hx.value=hex.toUpperCase();place(hex);
    root.querySelectorAll('.colors button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));onChange(c)};
  const pick=e=>{const r=pad.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    show(hslToHex(Math.round(x*359),SAT,Math.round(LMAX-y*(LMAX-LMIN))))};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);pick(e)});
  pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))pick(e)});
  pad.addEventListener('keydown',e=>{const{h,l}=hexToHsl(tokenHex(cur));const d={ArrowLeft:[-6,0],ArrowRight:[6,0],ArrowUp:[0,4],ArrowDown:[0,-4]}[e.key];if(!d)return;e.preventDefault();show(hslToHex((h+d[0]+360)%360,SAT,Math.max(LMIN,Math.min(LMAX,l+d[1]))))});
  hx.addEventListener('input',()=>{let v=hx.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v))show(v.toLowerCase(),true)});
  root.querySelectorAll('.colors button').forEach(b=>b.onclick=()=>show(b.dataset.c));
  if(onDone)root.querySelector('.cdone').onclick=()=>onDone(cur);
  show(initial);
}

/* ---------- dados ---------- */
let S=null;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function migrate(){
  if(!S)return;
  S.insurers=S.insurers||[];S.exceptions=S.exceptions||[];S.settings=S.settings||{msg:DEFAULT_MSG};
  S.appts.forEach(a=>{if(!a.pay)a.pay='particular'});
}
migrate();
const ACCENTS=[{key:'rosa',name:'Rosa'},{key:'azul',name:'Azul'},{key:'verde',name:'Verde'},{key:'roxo',name:'Roxo'},{key:'laranja',name:'Laranja'},{key:'teal',name:'Teal'}];
const ACCENT_HEX={rosa:'#C2256A',azul:'#2F6FD6',verde:'#1F8A4C',roxo:'#7C3AED',laranja:'#C2730B',teal:'#138A80'};
const accentPreview=k=>ACCENT_HEX[k]||ACCENT_HEX.rosa;

/* Ícone do app por profissão (Ajustes › Aparência). O padrão (fonoaudiologia)
   usa os arquivos da raiz (já citados pelo service worker); os demais ficam
   em icons/<profissão>/ e só entram em jogo se a pessoa trocar. */
const ICON_PROFESSIONS=[
  {key:'fonoaudiologia',name:'Fonoaudiologia',title:'Fonoaudiólogo(a)'},
  {key:'fisioterapia',name:'Fisioterapia',title:'Fisioterapeuta'},
  {key:'psicologia',name:'Psicologia',title:'Psicólogo(a)'},
  {key:'psiquiatria',name:'Psiquiatria',title:'Psiquiatra'},
  {key:'nutricao',name:'Nutrição',title:'Nutricionista'},
  {key:'psicopedagogia',name:'Psicopedagogia',title:'Psicopedagogo(a)'},
  {key:'pediatria',name:'Pediatria',title:'Pediatra'},
  {key:'terapia-ocupacional',name:'Terapia ocupacional',title:'Terapeuta ocupacional'},
];
const iconBase=key=>(!key||key==='fonoaudiologia')?'':'icons/'+key+'/';
let lastManifestUrl=null;
// Chrome/Edge cacheiam o favicon de forma agressiva e não repintam a aba só
// porque o href do <link> mudou — é preciso trocar o elemento inteiro.
function replaceLink(id,attrs){
  const old=document.getElementById(id);
  const el=document.createElement('link');
  el.id=id;
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  if(old)old.replaceWith(el);else document.head.appendChild(el);
  return el;
}
function applyIcon(){
  const key=(S&&S.settings&&S.settings.icon)||'fonoaudiologia';
  const base=iconBase(key);
  const appleHref=base?base+'icon-180.png':'icon-180.png?v=fono2';
  const favHref=base?base+'icon-192.png':'icon-192.png?v=fono2';
  replaceLink('appleIcon',{rel:'apple-touch-icon',sizes:'180x180',href:appleHref});
  replaceLink('favIcon',{rel:'icon',type:'image/png',sizes:'192x192',href:favHref});
  const manifestLink=$('#manifestLink');
  const manifest={name:'Minha Agenda',short_name:'Agenda',start_url:'./',display:'standalone',background_color:'#F6F5FA',theme_color:'#D6337A',lang:'pt-BR',
    icons:[{src:favHref,sizes:'192x192',type:'image/png'},{src:base?base+'icon-512.png':'icon-512.png?v=fono2',sizes:'512x512',type:'image/png',purpose:'any'}]};
  const url=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  if(manifestLink)manifestLink.href=url;
  if(lastManifestUrl)URL.revokeObjectURL(lastManifestUrl);
  lastManifestUrl=url;
}
applyIcon();
function applyAccent(){
  const a=S?.settings?.accent;
  if(a&&a!=='rosa')document.documentElement.dataset.accent=a;else delete document.documentElement.dataset.accent;
}
applyAccent();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar neste aparelho')}scheduleSync()}
function blankHours(){const h={};for(let i=0;i<7;i++)h[i]=[];return h}
function newPlace(name,color,kind){return{id:uid(),name,color,kind:kind||'clinica',address:'',price:0,duration:50,hours:blankHours()}}

/* ---------- sincronização com a nuvem ---------- */
const AUTH_KEY='minha-agenda-auth';
const SYNC_IDS_KEY='minha-agenda-sync-ids';
const API_BASE='/api';
let AUTH=null;
try{const r=localStorage.getItem(AUTH_KEY);if(r)AUTH=JSON.parse(r)}catch(e){}
function setAuth(a){AUTH=a;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a))}catch(e){}}
function clearAuth(){AUTH=null;try{localStorage.removeItem(AUTH_KEY);localStorage.removeItem(SYNC_IDS_KEY)}catch(e){}}
function getSyncIds(){try{const r=localStorage.getItem(SYNC_IDS_KEY);return r?JSON.parse(r):{}}catch(e){return{}}}
function setSyncIds(ids){try{localStorage.setItem(SYNC_IDS_KEY,JSON.stringify(ids))}catch(e){}}

async function apiFetch(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(AUTH&&AUTH.token)headers.Authorization='Bearer '+AUTH.token;
  const res=await fetch(API_BASE+path,Object.assign({},opts,{headers}));
  let body=null;
  try{body=await res.json()}catch(e){}
  if(!res.ok){const err=new Error((body&&body.error)||('http_'+res.status));err.status=res.status;err.body=body;throw err}
  return body;
}
async function apiSignup(email,password,name,title){
  const r=await apiFetch('/auth/signup',{method:'POST',body:JSON.stringify({email,password,name,title})});
  setAuth({token:r.token,email});
}
// Monta o S a partir de uma resposta "full" (?full=1) — perfil + todos os
// recursos numa chamada só, em vez de 7 separadas (ver api/auth/login.ts e
// api/auth/me.ts): o custo de cada requisição extra é alto, principalmente
// no vercel dev local, que não paraleliza bem várias invocações ao mesmo tempo.
function stateFromBootstrap(data){
  const{me,places,patients:patientsRaw,insurers,appts,exceptions,records}=data;
  const byPatient={};
  records.forEach(r=>{const rec=Object.assign({},r);const pid=rec.patientId;delete rec.patientId;(byPatient[pid]=byPatient[pid]||[]).push(rec)});
  const patients=patientsRaw.map(p=>Object.assign({},p,{records:byPatient[p.id]||[]}));
  setSyncIds({places:places.map(x=>x.id),insurers:insurers.map(x=>x.id),patients:patients.map(x=>x.id),appts:appts.map(x=>x.id),exceptions:exceptions.map(x=>x.id),records:records.map(x=>x.id)});
  const settings=(S&&S.settings)||{msg:DEFAULT_MSG};
  return{v:2,profile:{name:me.name,title:me.title||'',regNumber:me.regNumber||'',signature:me.signature||'',emailVerified:!!me.emailVerified},places,patients,appts,insurers,exceptions,settings};
}
async function apiLogin(email,password){
  // ?full=1: o login já devolve o perfil e todos os recursos junto com o
  // token — evita uma segunda chamada (GET /auth/me?full=1) logo em seguida.
  const r=await apiFetch('/auth/login?full=1',{method:'POST',body:JSON.stringify({email,password})});
  setAuth({token:r.token,email});
  return stateFromBootstrap(r);
}

const RESOURCE_PATHS={places:'/places',insurers:'/insurers',patients:'/patients',appts:'/appts',exceptions:'/exceptions',records:'/records'};
const patientForApi=p=>{const r=Object.assign({},p);delete r.records;return r};

let syncing=false,syncAgain=false;
async function pushAll(){
  if(!AUTH)return;
  if(syncing){syncAgain=true;return}
  syncing=true;
  try{
    const prevIds=getSyncIds();
    const curIds={places:[],insurers:[],patients:[],appts:[],exceptions:[],records:[]};
    for(const p of S.places){await apiFetch('/places',{method:'POST',body:JSON.stringify(p)});curIds.places.push(p.id)}
    for(const i of S.insurers){await apiFetch('/insurers',{method:'POST',body:JSON.stringify(i)});curIds.insurers.push(i.id)}
    for(const p of S.patients){
      await apiFetch('/patients',{method:'POST',body:JSON.stringify(patientForApi(p))});curIds.patients.push(p.id);
      for(const r of (p.records||[])){await apiFetch('/records',{method:'POST',body:JSON.stringify(Object.assign({},r,{patientId:p.id}))});curIds.records.push(r.id)}
    }
    for(const a of S.appts){await apiFetch('/appts',{method:'POST',body:JSON.stringify(a)});curIds.appts.push(a.id)}
    for(const x of S.exceptions){await apiFetch('/exceptions',{method:'POST',body:JSON.stringify(x)});curIds.exceptions.push(x.id)}
    for(const key of Object.keys(RESOURCE_PATHS)){
      const removed=(prevIds[key]||[]).filter(id=>curIds[key].indexOf(id)===-1);
      for(const id of removed){try{await apiFetch(RESOURCE_PATHS[key]+'?id='+id,{method:'DELETE'})}catch(e){}}
    }
    setSyncIds(curIds);
  }catch(e){console.warn('Sincronização falhou',e)}
  finally{syncing=false;if(syncAgain){syncAgain=false;pushAll()}}
}
let syncTimer=null;
function scheduleSync(){
  if(!AUTH)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushAll,900);
}

/* intervalos de atendimento do dia, já com folgas e horários extras */
function dayIntervals(date,p){
  const wd=parse(date).getDay();
  const ex=S.exceptions.filter(e=>e.date===date&&(!e.placeId||e.placeId===p.id));
  if(ex.some(e=>e.type==='block'&&e.allDay))return [];
  const ivs=(p.hours[wd]||[]).map(x=>({...x}));
  ex.filter(e=>e.type==='extra').forEach(e=>ivs.push({s:e.s,e:e.e}));
  return ivs;
}
const blocksOn=date=>S.exceptions.filter(e=>e.date===date&&e.type==='block');
function freeSlots(date,placeId,ignoreId){
  const busy=activeAppts().filter(a=>a.date===date&&a.id!==ignoreId).map(a=>[toMin(a.time),toMin(a.time)+(+a.dur||50)]);
  const out=[];
  const places=placeId?[place(placeId)].filter(Boolean):S.places;
  const isToday=date===todayISO();const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  for(const p of places){
    const dur=+p.duration||50;
    const pb=busy.concat(blocksOn(date).filter(e=>!e.allDay&&(!e.placeId||e.placeId===p.id)).map(e=>[toMin(e.s),toMin(e.e)]));
    for(const iv of dayIntervals(date,p)){
      if(!iv.s||!iv.e)continue;
      let t=toMin(iv.s);const end=toMin(iv.e);
      while(t+dur<=end){
        const clash=pb.find(([a,b])=>t<b&&t+dur>a);
        if(clash){t=Math.max(t+5,clash[1]);continue}
        if(!(isToday&&t<nowMin)&&!out.some(o=>o.time===toHM(t)&&o.placeId===p.id))out.push({time:toHM(t),placeId:p.id,dur});
        t+=dur;
      }
    }
  }
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function conflict(date,time,dur,ignoreId){
  const s=toMin(time),e=s+(+dur||50);
  return activeAppts().find(a=>a.id!==ignoreId&&a.date===date&&s<toMin(a.time)+(+a.dur||50)&&e>toMin(a.time));
}

// Redimensiona/comprime uma imagem (assinatura/carimbo) no navegador antes de
// guardar, pra não mandar fotos de câmera gigantes pro servidor.
function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('invalid_image'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('read_failed'));
    reader.readAsDataURL(file);
  });
}
// Carrega o pdf.js sob demanda (só quando alguém envia um PDF de timbre),
// pra não pesar o carregamento do app pra quem nunca usa isso.
const PDFJS_VERSION='3.11.174';
let pdfJsPromise=null;
function loadPdfJs(){
  if(pdfJsPromise)return pdfJsPromise;
  pdfJsPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`;
    s.onload=()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;
      resolve(window.pdfjsLib);
    };
    s.onerror=()=>reject(new Error('pdfjs_load_failed'));
    document.head.appendChild(s);
  });
  return pdfJsPromise;
}
// Renderiza a 1ª página de um PDF (timbre) como imagem — mesmo formato final
// da foto de assinatura, só que a entrada pode ser PDF.
async function pdfFirstPageToDataUrl(file,maxDim,quality){
  const pdfjsLib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const base=page.getViewport({scale:1});
  const viewport=page.getViewport({scale:maxDim/Math.max(base.width,base.height)});
  const c=document.createElement('canvas');c.width=viewport.width;c.height=viewport.height;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport}).promise;
  return c.toDataURL('image/jpeg',quality);
}
function saveFile(name,content,type,onSaved){
  const blob=new Blob([content],{type});
  try{const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(()=>onSaved&&onSaved()).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Arquivo salvo');onSaved&&onSaved();
}

  <div class="week">${days.map(d=>{const dd=parse(d);const ap=S.appts.filter(a=>a.date===d&&a.status!=='cancelado');const pls=[...new Set(ap.map(a=>place(a.placeId)?.color).filter(Boolean))].slice(0,3);
    return `<button class="day ${d===ui.sel?'sel':''} ${d===todayISO()?'today':''}" data-d="${d}"><span class="dw">${WD[dd.getDay()]}</span><span class="dn">${dd.getDate()}</span><span class="dots">${pls.map(c=>`<i style="background:${d===ui.sel?'var(--accent-ink)':`${cv(c)}`}"></i>`).join('')}</span></button>`}).join('')}</div>

  app.querySelectorAll('.day').forEach(b=>b.onclick=()=>{ui.sel=b.dataset.d;render()});

function shareFree(){
  const ws=parse(ui.week);
  const build=(placeId)=>{
    let out=[];
    for(let i=0;i<7;i++){const d=iso(addDays(ws,i));if(d<todayISO())continue;const fs=freeSlots(d,placeId||null);if(!fs.length)continue;
      const dd=parse(d);out.push(`*${cap(WDL[dd.getDay()])} ${dd.getDate()}/${pad(dd.getMonth()+1)}*`);
      if(placeId){out.push(fs.map(f=>f.time).join(' · '))}
      else{const by={};fs.forEach(f=>(by[f.placeId]=by[f.placeId]||[]).push(f.time));for(const k in by)out.push(`${place(k).name}: ${by[k].join(' · ')}`)}
      out.push('');
    }
    if(!out.length)return 'Sem horários livres nesta semana.';
    return `Horários disponíveis${placeId?' em '+place(placeId).name:''} nesta semana:\n\n`+out.join('\n').trim();
  };
  let pid='';
  openSheet('Horários livres da semana',`
    <p class="muted small" style="margin:0">Copie e cole no WhatsApp para quem pedir horário.</p>
    <div class="seg solid" id="fsSeg"><button data-v="">Todos</button>${S.places.map(p=>`<button data-v="${p.id}">${esc(p.name)}</button>`).join('')}</div>

    <button class="btn primary block" id="fsCopy">Copiar texto</button>`,b=>{
    const seg=b.querySelector('#fsSeg');
    const upd=()=>{b.querySelector('#fsText').textContent=build(pid);segSelect(seg,pid)};
    seg.querySelectorAll('button').forEach(x=>x.onclick=()=>{pid=x.dataset.v;upd()});
    b.querySelector('#fsCopy').onclick=()=>copy(b.querySelector('#fsText').textContent);
    upd();
  });
}

    $b('#fDur').oninput=()=>{durTouched=true;warn()};$b('#fPrice').oninput=()=>priceTouched=true;
    $b('#fName').oninput=()=>{const m=S.patients.find(p=>p.name.toLowerCase()===$b('#fName').value.trim().toLowerCase());if(!m)return;
      if(m.phone&&!digits($b('#fPhone').value))$b('#fPhone').value=fmtPhone(m.phone);
      if(!id&&m.pay){insId=m.insurerId||'';fillIns();setPay(m.pay)}};
    $b('#fSave').onclick=()=>{
      const name=$b('#fName').value.trim(),date=$b('#fDate').value,time=$b('#fTime').value;
      if(!name){toast('Escreva o nome do paciente');$b('#fName').focus();return}
      if(!date||!time){toast('Escolha data e horário');return}
      let ins=null;
      if(pay==='convenio'){
        if(insId==='__new'){const n=$b('#niName').value.trim();if(!n){toast('Escreva o nome do convênio');$b('#niName').focus();return}
          ins=S.insurers.find(i=>i.name.toLowerCase()===n.toLowerCase());
          if(!ins){ins={id:uid(),name:n,price:+$b('#niPrice').value||0,prices:{}};S.insurers.push(ins)}}
        else{ins=insurer(insId);if(!ins){toast('Escolha o convênio');return}}
      }
      let p=S.patients.find(x=>x.name.toLowerCase()===name.toLowerCase());
      const phone=digits($b('#fPhone').value);
      if(!p){p={id:uid(),name,phone,notes:''};S.patients.push(p)}else if(phone)p.phone=phone;
      p.pay=pay;p.insurerId=ins?.id||'';
      const base={patientId:p.id,placeId,time,dur:+$b('#fDur').value||place(placeId).duration||50,price:+$b('#fPrice').value||0,pay,insurerId:ins?.id||'',insName:ins?.name||'',notes:$b('#fNotes').value.trim()};
      if(id){Object.assign(S.appts.find(x=>x.id===id),base,{date})}
      else{const rep=+($b('#fRep')?.value||1);for(let i=0;i<rep;i++)S.appts.push({id:uid(),...base,date:iso(addDays(parse(date),7*i)),status:'agendado',paid:false})}
      save();ui.sel=date;ui.week=iso(startOfWeek(parse(date)));ui.tab='agenda';
      closeSheet();render();toast(id?'Alterações salvas':'Atendimento agendado');
    };
  });
}

/* ---------- pacientes ---------- */
function renderPatients(){
  const q=ui.q.trim().toLowerCase();
  const list=S.patients.filter(p=>!q||p.name.toLowerCase().includes(q)||(digits(q)&&digits(p.phone).includes(digits(q)))).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const next=pid=>S.appts.filter(a=>a.patientId===pid&&a.status!=='cancelado'&&a.date>=todayISO()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  app.innerHTML=`<div class="top"><div><h1>Pacientes</h1><div class="sub num">${S.patients.length} cadastrados</div></div></div>
  <input class="search" id="q" type="search" placeholder="Buscar por nome ou telefone" value="${esc(ui.q)}">
  <div class="section">${list.length?`<div class="rows">${list.map(p=>{const n=next(p.id);const ins=p.pay==='convenio'?insurer(p.insurerId)?.name:'';return `<button class="row" data-p="${p.id}"><span class="avatar">${esc(initials(p.name))}</span><span class="grow"><b>${esc(p.name)}</b><span class="small muted">${n?`Próximo: ${dayLabel(n.date)} às ${n.time}`:(p.phone?esc(fmtPhone(p.phone)):'Sem telefone')}${ageOf(p.birth)!==null?' · '+ageOf(p.birth)+' anos':''}${ins?' · '+esc(ins):''}</span></span><span class="chev">›</span></button>`}).join('')}</div>`:`<div class="empty"><b>${q?'Ninguém encontrado':'Nenhum paciente ainda'}</b>${q?'Tente outro nome.':'Os pacientes aparecem aqui quando você agenda o primeiro atendimento.'}</div>`}</div>`;
  const qi=$('#q');qi.oninput=()=>{ui.q=qi.value;const pos=qi.selectionStart;renderPatients();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>viewPatient(b.dataset.p));
}
const SEX={F:'Feminino',M:'Masculino',O:'Outro'};
function ageOf(b){if(!b)return null;const d=parse(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a>=0&&a<130?a:null}
const brDate=s=>s?parse(s).toLocaleDateString('pt-BR'):'';
const RECORD_TEMPLATE='Queixa / relato:\n\nProcedimentos realizados:\n\nEvolução:\n\nConduta / orientações:\n';
function patientSubtitle(p){const a=ageOf(p.birth);return [a!==null?a+' anos':'',SEX[p.sex]||'',p.pay==='convenio'?(insurer(p.insurerId)?.name||''):'Particular'].filter(Boolean).join(' · ')}

      if(tab==='atend')body=`
        <div class="stats"><div class="stat"><div class="label">Atendimentos</div><div class="v">${done.length}</div></div><div class="stat"><div class="label">A receber</div><div class="v sm">${money(owed)}</div></div></div>

        <div class="two"><label class="field"><span>De</span><input class="input" id="rFrom" type="date" value="${ui.prFrom||m}"></label><label class="field"><span>Até</span><input class="input" id="rTo" type="date" value="${ui.prTo||todayISO()}"></label></div>
        <label class="field"><span>Local</span><select class="input" id="rPlace"><option value="">Todos os locais</option>${S.places.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>

function editRecord(patientId,recId,pre={}){
  const p=patient(patientId);p.records=p.records||[];
  const orig=recId?p.records.find(r=>r.id===recId):null;
  const r=orig?{...orig}:{id:uid(),date:pre.date||todayISO(),placeId:pre.placeId||'',apptId:pre.apptId||'',text:''};
  const appts=S.appts.filter(a=>a.patientId===patientId&&a.status!=='cancelado').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,40);
  openSheet(orig?'Editar evolução':'Nova evolução',`
    <div class="small muted">${esc(p.name)}</div>
    <label class="field"><span>Atendimento</span><select class="input" id="eAppt"><option value="">Sem vínculo com atendimento</option>${appts.map(a=>`<option value="${a.id}" ${a.id===r.apptId?'selected':''}>${brDate(a.date)} ${a.time} · ${esc(place(a.placeId)?.name||'')}</option>`).join('')}</select></label>
    <div class="two"><label class="field"><span>Data</span><input class="input" id="eDate" type="date" value="${r.date}"></label>
      <label class="field"><span>Local</span><select class="input" id="ePlace"><option value="">—</option>${S.places.map(x=>`<option value="${x.id}" ${x.id===r.placeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
    <label class="field"><span>Evolução / anotações da sessão</span><textarea class="input" id="eText" style="min-height:220px">${esc(r.text)}</textarea></label>
    ${r.text?'':'<button class="link" id="eTpl">Inserir modelo (queixa, procedimentos, evolução, conduta)</button>'}
    <button class="btn primary block" id="eSave">Salvar no prontuário</button>
    ${orig?'<button class="btn danger block" id="eDel">Excluir evolução</button>':''}`,b=>{
    const $b=s=>b.querySelector(s);
    $b('#eAppt').onchange=()=>{const a=S.appts.find(x=>x.id===$b('#eAppt').value);if(a){$b('#eDate').value=a.date;$b('#ePlace').value=a.placeId}};
    if($b('#eTpl'))$b('#eTpl').onclick=()=>{const t=$b('#eText');t.value=RECORD_TEMPLATE+(t.value?'\n'+t.value:'');t.focus();$b('#eTpl').remove()};
    $b('#eSave').onclick=()=>{const text=$b('#eText').value.trim();if(!text){toast('Escreva a evolução');return}
      Object.assign(r,{apptId:$b('#eAppt').value,date:$b('#eDate').value||todayISO(),placeId:$b('#ePlace').value,text});
      if(orig)Object.assign(orig,r);else p.records.push(r);
      save();render();toast('Evolução salva');viewPatient(patientId,'prontuario')};
    const del=$b('#eDel');if(del)twoTap(del,'Excluir evolução','Toque de novo para excluir',()=>{p.records=p.records.filter(x=>x.id!==recId);save();toast('Evolução excluída');viewPatient(patientId,'prontuario')});
  });
}

function signBlock(extra){
  return `<div class="sign">${S.profile.signature?`<img src="${S.profile.signature}" alt="Assinatura" style="max-width:220px;max-height:90px;display:block;margin:0 auto 6px">`:'<div class="line"></div>'}${esc(S.profile.name)}${S.profile.title?'<br>'+esc(S.profile.title):''}${S.profile.regNumber?'<br>'+esc(S.profile.regNumber):''}${extra?'<br>'+extra:''}</div>`;
}
// O timbre fica como fundo da página (igual papel timbrado de verdade: o
// conteúdo é escrito por cima dele, não empurrado pra depois da imagem).
function letterheadWrap(pl,contentHtml){
  if(!pl||!pl.letterhead)return contentHtml;
  return `<div style="position:relative">
    <img src="${pl.letterhead}" alt="Timbre" style="position:absolute;top:0;left:0;width:100%;height:auto;z-index:0;pointer-events:none">
    <div style="position:relative;z-index:1;padding-top:130px">${contentHtml}</div>
  </div>`;
}
function patientReport(p,{from,to,placeId,ev}){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const ap=S.appts.filter(a=>a.patientId===p.id&&inR(a.date)&&(!placeId||a.placeId===placeId)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const done=ap.filter(a=>a.status==='concluido'),miss=ap.filter(a=>a.status==='faltou');
  const recs=(p.records||[]).filter(r=>inR(r.date)&&(!placeId||!r.placeId||r.placeId===placeId)).sort((a,b)=>a.date.localeCompare(b.date));
  const age=ageOf(p.birth);const pl=placeId?place(placeId):null;
  const used=[...new Set(ap.filter(a=>a.status!=='cancelado').map(payName))];const conv=used.length?used.join(', '):(p.pay==='convenio'?(insurer(p.insurerId)?.name||''):'Particular');
  const info=[['Paciente',p.name],['Data de nascimento',p.birth?brDate(p.birth)+(age!==null?` (${age} anos)`:''):''],['Sexo',SEX[p.sex]||''],['Nome da mãe',p.mother],['Nome do pai',p.father],['Convênio',conv],['Carteirinha',p.card],['Telefone',fmtPhone(p.phone)],['Motivo / diagnóstico',p.diag]].filter(x=>x[1]);
  const per=`${from?brDate(from):'início'} a ${to?brDate(to):'hoje'}${pl?' · '+pl.name:''}`;
  const L=['RELATÓRIO DE ATENDIMENTO','',...info.map(([k,v])=>`${k}: ${v}`),'',`Período: ${per}`,`Sessões realizadas: ${done.length}${done.length?' ('+done.map(a=>fmtDate(a.date)).join(', ')+')':''}`];
  if(miss.length)L.push(`Faltas: ${miss.length} (${miss.map(a=>fmtDate(a.date)).join(', ')})`);
  if(ev){L.push('','EVOLUÇÕES');if(!recs.length)L.push('Nenhuma evolução registrada no período.');recs.forEach(r=>{L.push('',`${brDate(r.date)}${r.placeId&&place(r.placeId)?' – '+place(r.placeId).name:''}`,r.text)})}
  L.push('',`${S.profile.name}${S.profile.title?' – '+S.profile.title:''}`,`Emitido em ${brDate(todayISO())}`);
  const body=`<h1>Relatório de atendimento</h1><table class="kv">${info.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}<tr><th>Período</th><td>${esc(per)}</td></tr><tr><th>Sessões realizadas</th><td>${done.length}${done.length?' – '+done.map(a=>fmtDate(a.date)).join(', '):''}</td></tr>${miss.length?`<tr><th>Faltas</th><td>${miss.length} – ${miss.map(a=>fmtDate(a.date)).join(', ')}</td></tr>`:''}</table>
    ${ev?`<h2>Evoluções</h2>${recs.length?recs.map(r=>`<div class="ev"><b>${brDate(r.date)}${r.placeId&&place(r.placeId)?' – '+esc(place(r.placeId).name):''}</b><p>${esc(r.text)}</p></div>`).join(''):'<p>Nenhuma evolução registrada no período.</p>'}`:''}
    ${signBlock(`<small>Emitido em ${brDate(todayISO())}</small>`)}`;
  return{text:L.join('\n'),html:letterheadWrap(pl,body)};
}

function clinicReport(placeId,R){
  const pl=place(placeId);
  const ap=R.inP.filter(a=>a.placeId===placeId&&(a.status==='concluido'||a.status==='faltou'));
  const byP=new Map();ap.forEach(a=>{if(!byP.has(a.patientId))byP.set(a.patientId,[]);byP.get(a.patientId).push(a)});
  const rows=[...byP.entries()].map(([pid,l])=>{const p=patient(pid)||{name:'Paciente',records:[]};const done=l.filter(a=>a.status==='concluido'),miss=l.filter(a=>a.status==='faltou');
    const recs=(p.records||[]).filter(r=>r.date>=R.pr.start&&r.date<=R.pr.end&&(!r.placeId||r.placeId===placeId)).sort((a,b)=>b.date.localeCompare(a.date));
    return{p,done,miss,pay:payName(l[0]),last:recs[0]}}).sort((a,b)=>a.p.name.localeCompare(b.p.name,'pt-BR'));
  const L=[`RELATÓRIO DE PACIENTES – ${pl.name.toUpperCase()}`,`Período: ${brDate(R.pr.start)} a ${brDate(R.pr.end)}`,`Profissional: ${S.profile.name}${S.profile.title?' – '+S.profile.title:''}`,`Pacientes: ${rows.length} · Sessões realizadas: ${rows.reduce((s,r)=>s+r.done.length,0)}`];
  rows.forEach(r=>{const a=ageOf(r.p.birth);L.push('',`• ${r.p.name}${a!==null?` (${a} anos)`:''} – ${r.pay}${r.p.card?' · carteirinha '+r.p.card:''}`,`  Sessões: ${r.done.length}${r.done.length?' ('+r.done.map(x=>fmtDate(x.date)).join(', ')+')':''}${r.miss.length?` · Faltas: ${r.miss.length}`:''}`);
    if(r.p.diag)L.push(`  Motivo: ${r.p.diag}`);if(r.last)L.push(`  Última evolução (${fmtDate(r.last.date)}): ${r.last.text.replace(/\s*\n\s*/g,' ').slice(0,280)}`)});
  const body=`<h1>Relatório de pacientes – ${esc(pl.name)}</h1><p class="meta">Período: ${brDate(R.pr.start)} a ${brDate(R.pr.end)} · Profissional: ${esc(S.profile.name)}${S.profile.title?' – '+esc(S.profile.title):''}</p>
    <table class="grid"><thead><tr><th>Paciente</th><th>Pagamento</th><th>Sessões</th><th>Datas</th><th>Faltas</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.p.name)}${ageOf(r.p.birth)!==null?`<br><small>${ageOf(r.p.birth)} anos</small>`:''}</td><td>${esc(r.pay)}${r.p.card?`<br><small>${esc(r.p.card)}</small>`:''}</td><td>${r.done.length}</td><td>${r.done.map(x=>fmtDate(x.date)).join(', ')}</td><td>${r.miss.length||''}</td></tr>`).join('')}</tbody></table>
    ${rows.some(r=>r.last||r.p.diag)?`<h2>Resumo clínico</h2>${rows.filter(r=>r.last||r.p.diag).map(r=>`<div class="ev"><b>${esc(r.p.name)}</b>${r.p.diag?`<p><i>Motivo:</i> ${esc(r.p.diag)}</p>`:''}${r.last?`<p><i>Última evolução (${fmtDate(r.last.date)}):</i> ${esc(r.last.text)}</p>`:''}</div>`).join('')}`:''}
    ${signBlock()}`;
  return{text:L.join('\n'),html:letterheadWrap(pl,body),count:rows.length};
}

function printDoc(title,inner){
  // Mostra dentro do próprio app em vez de window.open: um PWA instalado na
  // tela de início do iPhone não consegue abrir uma janela/aba nova.
  const el=$('#printArea');
  el.innerHTML=`<div class="pdBar"><button class="pdPrint">Imprimir ou salvar PDF</button><button class="pdClose">Fechar</button></div><div class="pdInner">${inner}</div>`;

function editDay(placeId,d){
  const p=place(placeId);
  let ivs=(p.hours[d]||[]).map(x=>({...x}));
  openSheet(`${esc(p.name)} · ${cap(WDL[d])}`,'',b=>{
    const draw=()=>{
      b.innerHTML=`
      <label class="toggle"><span>Atende neste dia</span><input type="checkbox" id="dOn" ${ivs.length?'checked':''}></label>
      <div id="dBody" ${ivs.length?'':'hidden'} style="display:flex;flex-direction:column;gap:10px">
        <div class="label">Faixas de horário</div>
        ${ivs.map((x,i)=>`<div class="ivrow">${timeSel(`data-i="${i}" data-f="s"`,x.s)}<span class="muted">às</span>${timeSel(`data-i="${i}" data-f="e"`,x.e)}<button class="x" data-rm="${i}" aria-label="Remover faixa">✕</button></div>`).join('')}
        <button class="link" id="dAdd">+ Adicionar outra faixa</button>
        <div class="label" style="margin-top:4px">Atalhos</div>
        <div class="presets"><button data-ps="08:00|12:00">Manhã 08–12</button><button data-ps="13:00|18:00">Tarde 13–18</button><button data-ps="18:00|20:00">Noite 18–20</button><button data-ps="08:00|20:00">Dia todo 08–20</button></div>
      </div>
      <label class="toggle"><span>Aplicar também aos outros dias úteis (seg a sex)</span><input type="checkbox" id="dAll"></label>
      <button class="btn primary block" id="dSave">Salvar ${WDL[d]}</button>`;
      b.querySelector('#dOn').onchange=e=>{ivs=e.target.checked?(ivs.length?ivs:[{s:'08:00',e:'12:00'}]):[];draw()};
      b.querySelectorAll('select').forEach(s=>s.onchange=()=>{ivs[+s.dataset.i][s.dataset.f]=s.value});
      b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{ivs.splice(+x.dataset.rm,1);draw()});
      b.querySelector('#dAdd').onclick=()=>{const last=ivs[ivs.length-1];const s=last?toHM(Math.min(toMin(last.e)+60,22*60)):'08:00';ivs.push({s,e:toHM(Math.min(toMin(s)+240,23*60))});draw()};
      b.querySelectorAll('[data-ps]').forEach(x=>x.onclick=()=>{const[s,e]=x.dataset.ps.split('|');ivs.push({s,e});draw()});
      b.querySelector('#dSave').onclick=()=>{
        const clean=ivs.filter(x=>x.s<x.e).sort((a,b)=>a.s.localeCompare(b.s));
        if(ivs.length&&!clean.length){toast('O horário final precisa ser depois do inicial');return}
        for(let i=1;i<clean.length;i++)if(clean[i].s<clean[i-1].e){toast('Duas faixas estão se sobrepondo');return}
        const days=b.querySelector('#dAll').checked?[1,2,3,4,5]:[d];
        days.forEach(x=>p.hours[x]=clean.map(c=>({...c})));
        save();closeSheet();render();toast('Horários salvos');
      };
    };
    draw();
  });
}
function editException(id,type){
  const e=id?{...S.exceptions.find(x=>x.id===id)}:{id:null,date:ui.sel>=todayISO()?ui.sel:todayISO(),placeId:'',type:type||'block',allDay:(type||'block')==='block',s:'18:00',e:'20:00',note:''};
  if(!e.placeId&&e.type==='extra')e.placeId=S.places[0].id;
  openSheet(id?'Editar exceção':'Folga ou horário extra','',b=>{
    const draw=()=>{
      b.innerHTML=`
      <div class="seg solid" id="xType"><button data-v="block">Bloquear (folga)</button><button data-v="extra">Horário extra</button></div>
      <label class="field"><span>Data</span><input class="input" id="xDate" type="date" value="${e.date}"></label>
      <label class="field"><span>Local</span><select class="input" id="xPlace">${e.type==='block'?'<option value="">Todos os locais</option>':''}${S.places.map(p=>`<option value="${p.id}" ${p.id===e.placeId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
      ${e.type==='block'?`<label class="toggle"><span>Dia inteiro</span><input type="checkbox" id="xAll" ${e.allDay?'checked':''}></label>`:''}
      ${e.type==='extra'||!e.allDay?`<div class="ivrow" style="grid-template-columns:1fr auto 1fr">${timeSel('id="xS"',e.s)}<span class="muted">às</span>${timeSel('id="xE"',e.e)}</div>`:''}
      <label class="field"><span>Motivo (opcional)</span><input class="input" id="xNote" value="${esc(e.note)}" placeholder="${e.type==='block'?'Ex.: feriado, congresso':'Ex.: reposição'}"></label>
      <button class="btn primary block" id="xSave">Salvar</button>
      ${id?'<button class="btn danger block" id="xDel">Remover</button>':''}`;
      segSelect(b.querySelector('#xType'),e.type);
      const keep=()=>{e.date=b.querySelector('#xDate').value;e.placeId=b.querySelector('#xPlace').value;e.note=b.querySelector('#xNote').value;
        if(b.querySelector('#xS')){e.s=b.querySelector('#xS').value;e.e=b.querySelector('#xE').value}};
      b.querySelectorAll('#xType button').forEach(x=>x.onclick=()=>{keep();e.type=x.dataset.v;if(e.type==='extra'&&!e.placeId)e.placeId=S.places[0].id;e.allDay=e.type==='block'&&e.allDay;draw()});
      const xa=b.querySelector('#xAll');if(xa)xa.onchange=()=>{keep();e.allDay=xa.checked;draw()};
      b.querySelector('#xSave').onclick=()=>{keep();
        if(!e.date){toast('Escolha a data');return}
        if(!(e.type==='block'&&e.allDay)&&e.s>=e.e){toast('O horário final precisa ser depois do inicial');return}
        const rec={...e,allDay:e.type==='block'&&e.allDay};
        if(id)Object.assign(S.exceptions.find(x=>x.id===id),rec);else S.exceptions.push({...rec,id:uid()});
        const hits=activeAppts().filter(a=>a.date===e.date&&(!e.placeId||a.placeId===e.placeId)&&(rec.allDay||(toMin(a.time)<toMin(e.e)&&toMin(a.time)+(+a.dur||50)>toMin(e.s))));
        save();closeSheet();render();toast(rec.type==='block'&&hits.length?`Salvo. Há ${hits.length} atendimento(s) marcados nesse bloqueio`:'Salvo');
      };
      const del=b.querySelector('#xDel');if(del)twoTap(del,'Remover','Toque de novo para remover',()=>{S.exceptions=S.exceptions.filter(x=>x.id!==id);save();closeSheet();render();toast('Removido')});
    };
    draw();
  });
}

/* ---------- relatórios ---------- */
function period(){
  const a=parse(ui.rep.anchor);
  if(ui.rep.mode==='dia'){
    const lbl=`${cap(WDL[a.getDay()])}, ${a.getDate()} de ${MES[a.getMonth()]} de ${a.getFullYear()}`;
    const short=`${pad(a.getDate())}/${pad(a.getMonth()+1)}`;
    return{start:iso(a),end:iso(a),label:lbl,short,file:'dia-'+iso(a)};
  }
  if(ui.rep.mode==='semana'){const s=startOfWeek(a),e=addDays(s,6);
    const lbl=s.getMonth()===e.getMonth()?`${s.getDate()} a ${e.getDate()} de ${MES[e.getMonth()]}`:`${s.getDate()}/${pad(s.getMonth()+1)} a ${e.getDate()}/${pad(e.getMonth()+1)}`;
    return{start:iso(s),end:iso(e),label:'Semana de '+lbl,short:lbl,file:'semana-'+iso(s)}}
  const s=new Date(a.getFullYear(),a.getMonth(),1),e=new Date(a.getFullYear(),a.getMonth()+1,0);
  return{start:iso(s),end:iso(e),label:cap(MES[s.getMonth()])+' de '+s.getFullYear(),short:cap(MES[s.getMonth()])+' '+s.getFullYear(),file:'mes-'+iso(s).slice(0,7)};
}
function reportData(){
  const pr=period();
  const inP=S.appts.filter(a=>a.date>=pr.start&&a.date<=pr.end);
  const done=inP.filter(a=>a.status==='concluido');
  const sched=inP.filter(a=>a.status==='agendado'||a.status==='confirmado');
  const sum=l=>l.reduce((s,a)=>s+(+a.price||0),0);
  const groupBy=(list,keyFn)=>{const m=new Map();list.forEach(a=>{const k=keyFn(a);if(!m.has(k))m.set(k,[]);m.get(k).push(a)});return m};
  const places=S.places.map(p=>{
    const pd=done.filter(a=>a.placeId===p.id);
    const groups=[...groupBy(pd,payKey).entries()].map(([k,l])=>({key:k,name:payName(l[0]),list:l,total:sum(l),paid:sum(l.filter(a=>a.paid)),pend:sum(l.filter(a=>!a.paid)),prices:[...new Set(l.map(a=>+a.price||0))]})).sort((x,y)=>(x.key==='particular')-(y.key==='particular')||x.name.localeCompare(y.name));
    return{p,list:pd,total:sum(pd),paid:sum(pd.filter(a=>a.paid)),pend:sum(pd.filter(a=>!a.paid)),groups,sched:sched.filter(a=>a.placeId===p.id)};
  }).filter(x=>x.list.length||x.sched.length);
  const byPay=[...groupBy(done,payKey).entries()].map(([k,l])=>({key:k,name:payName(l[0]),n:l.length,total:sum(l),pend:sum(l.filter(a=>!a.paid))})).sort((x,y)=>y.total-x.total);
  return{pr,inP,done,sched,missed:inP.filter(a=>a.status==='faltou'),cancel:inP.filter(a=>a.status==='cancelado'),
    total:sum(done),paid:sum(done.filter(a=>a.paid)),pend:sum(done.filter(a=>!a.paid)),forecast:sum(sched),places,byPay};
}
function groupDet(g){return g.prices.length===1?`${g.list.length} × ${money(g.prices[0])}`:`${g.list.length} atendimentos`}
function miniApptRow(a){
  const p=patient(a.patientId);

}

function reportText(R){
  const L=[];
  L.push(`*Relatório de atendimentos – ${R.pr.label}*`);
  if(S.profile.name&&!S.demo)L.push(S.profile.name+(S.profile.title?' · '+S.profile.title:''));
  L.push('');
  L.push(`Atendidos: ${R.done.length} · Faltas: ${R.missed.length} · Agendados: ${R.sched.length}`);
  L.push(`Receita: ${money(R.total)}`);
  L.push(`Recebido: ${money(R.paid)} · A receber: ${money(R.pend)}`);
  if(R.forecast)L.push(`Previsão dos agendados: ${money(R.forecast)}`);
  R.places.forEach(x=>{if(!x.list.length)return;L.push('');L.push(`*${x.p.name}* — ${x.list.length} atend. · ${money(x.total)}`);
    x.groups.forEach(g=>L.push(`• ${g.name}: ${groupDet(g)} = ${money(g.total)}${g.pend?` (a receber ${money(g.pend)})`:' (recebido)'}`))});
  return L.join('\n');
}
function reportCsv(R){
  const q=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const num=v=>(+v||0).toFixed(2).replace('.',',');
  const rows=[['Data','Hora','Paciente','Telefone','Local','Pagamento','Convênio','Valor (R$)','Situação','Recebido']];
  [...R.inP].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(a=>{const p=patient(a.patientId);
    rows.push([parse(a.date).toLocaleDateString('pt-BR'),a.time,p?.name||'',fmtPhone(p?.phone||''),place(a.placeId)?.name||'',a.pay==='convenio'?'Convênio':'Particular',a.pay==='convenio'?payName(a):'',num(a.price),STATUS[a.status],a.status==='concluido'?(a.paid?'Sim':'Não'):''])});
  rows.push([]);rows.push(['Resumo por local e pagamento (atendidos)']);rows.push(['Local','Pagamento','Quantidade','Total (R$)','Recebido (R$)','A receber (R$)']);
  R.places.forEach(x=>x.groups.forEach(g=>rows.push([x.p.name,g.name,g.list.length,num(g.total),num(g.paid),num(g.pend)])));
  rows.push(['Total','',R.done.length,num(R.total),num(R.paid),num(R.pend)]);
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

    <label class="field"><span>Informações para o paciente (opcional)</span><textarea class="input" id="lInfo" placeholder="Ex.: Sala 3, 2º andar. Chegar 10 min antes e levar a carteirinha do convênio.">${esc(p.info||'')}</textarea></label>
    <div class="field"><span>Mensagem de confirmação deste local</span><textarea class="input" id="lMsg" style="min-height:110px">${esc(p.msg||placeMsgSuggestion(p))}</textarea>
      <span class="small muted" style="font-weight:400">{endereco} e {info} são preenchidos com os campos acima. Também valem {paciente}, {dia}, {hora}, {local} e {profissional}.</span>
      <button type="button" class="link" id="lMsgReset">Usar a mensagem geral de Ajustes</button></div>
    <div class="info">Os dias e horários de atendimento ficam na aba <b>Horários</b>.</div>
    <button class="btn primary block" id="lSave">${id?'Salvar local':'Salvar e definir horários'}</button>
    ${id?`<button class="btn danger block" id="lDel">Excluir local</button>`:''}`,b=>{
    const $b=s=>b.querySelector(s);
    segSelect($b('#lKind'),p.kind);
    b.querySelectorAll('#lKind button').forEach(x=>x.onclick=()=>{const wasSug=$b('#lMsg').value===placeMsgSuggestion(p);p.kind=x.dataset.v;segSelect($b('#lKind'),p.kind);if(wasSug)$b('#lMsg').value=placeMsgSuggestion(p)});
    $b('#lMsgReset').onclick=()=>{$b('#lMsg').value=S.settings.msg||DEFAULT_MSG};
    $b('#lColBtn').onclick=()=>{const box=$b('#lColor');if(!box.hidden){box.hidden=true;return}box.hidden=false;
      colorPicker(box,p.color,c=>{p.color=c;$b('#lSw').style.background=cv(c)},()=>{box.hidden=true;$b('#lColBtn').focus()})};
    $b('#lLhFile').onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
      const btnLbl=$b('#lLhLabel');const oldTxt=btnLbl.textContent;
      if(isPdf)btnLbl.textContent='Lendo PDF…';
      try{
        const dataUrl=isPdf?await pdfFirstPageToDataUrl(f,900,0.85):await compressImage(f,700,0.85);
        p.letterhead=dataUrl;
        $b('#lLhPreview').innerHTML=`<img src="${dataUrl}" alt="Timbre" style="max-width:100%;max-height:120px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:6px;display:block">`;
        $b('#lLhRemove').hidden=false;
        toast('Modelo timbrado pronto — toque em Salvar local');
      }catch(err){toast(isPdf?'Não consegui ler esse PDF. Tente outro arquivo ou uma imagem':'Não consegui processar essa imagem')}
      btnLbl.textContent=oldTxt;
    };
    $b('#lLhRemove').onclick=()=>{p.letterhead='';$b('#lLhPreview').innerHTML='<div class="small muted">Nenhum modelo enviado ainda.</div>';$b('#lLhRemove').hidden=true};
    $b('#lSave').onclick=()=>{
      p.name=$b('#lName').value.trim();if(!p.name){toast('Dê um nome ao local');$b('#lName').focus();return}
      p.address=$b('#lAddr').value.trim();p.price=+$b('#lPrice').value||0;p.duration=+$b('#lDur').value||50;
      p.info=$b('#lInfo').value.trim();const m=$b('#lMsg').value.trim();p.msg=(m===(S.settings.msg||DEFAULT_MSG))?'':m;
      if(orig)Object.assign(orig,p);else S.places.push(p);
      save();closeSheet();if(!orig){ui.tab='horarios'}render();toast(orig?'Local salvo':'Local criado. Toque nos dias para definir horários');
    };
    const del=$b('#lDel');if(del)twoTap(del,'Excluir local',uses?`Isso apaga ${uses} atendimentos deste local. Toque de novo`:'Toque de novo para excluir',()=>{
      if(S.places.length===1){toast('Mantenha pelo menos um local');return}
      S.appts=S.appts.filter(a=>a.placeId!==id);S.exceptions=S.exceptions.filter(e=>e.placeId!==id);S.places=S.places.filter(x=>x.id!==id);save();closeSheet();render();toast('Local excluído')});
  });
}

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

</body>
</html>
